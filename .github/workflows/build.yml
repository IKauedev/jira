name: Build Applications

on:
  push:
    branches:
      - main
      - master
      - develop
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jira-app:
    name: Build jira-app
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jira-app with Gradle
        run: ./gradlew :clean :build

      - name: Build jira-app Docker image
        run: docker build -f docker/Dockerfile.jira -t jira-app:ci .

  integration-service:
    name: Build integration-service
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build integration-service with Gradle
        run: ./gradlew :integration-service:clean :integration-service:build

      - name: Build integration-service Docker image
        run: docker build -f docker/Dockerfile.integration -t integration-service:ci .
