spring:
  application:
    name: integration-service

  # MongoDB Configuration
  data:
    mongodb:
      uri: ${INTEGRATION_MONGODB_URI:mongodb://localhost:27017/integration_db}
      auto-index-creation: ${MONGO_AUTO_INDEX_CREATION:true}

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Server Configuration
server:
  port: 8081
  servlet:
    context-path: /

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mongo:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.project.integration: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Integration Properties
integration:
  security:
    apiKey: ${INTEGRATION_API_KEY:}
    headerName: ${INTEGRATION_API_KEY_HEADER:X-Integration-Api-Key}

  github:
    baseUrl: ${GITHUB_API_URL:https://api.github.com}
    apiVersion: v3
    token: ${GITHUB_TOKEN:}

  slack:
    baseUrl: https://slack.com/api
    token: ${SLACK_TOKEN:${SLACK_BOT_TOKEN:}}
    webhookUrl: ${SLACK_WEBHOOK_URL:}

  email:
    host: ${EMAIL_HOST:}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}

# Application Settings
app:
  version: 1.0.0
  title: Integration Service API
  description: API centralizadora de integrações com GitHub, Slack e outras plataformas

info:
  app:
    name: ${app.title}
    version: ${app.version}
    description: ${app.description}
