spring:
  data:
    mongodb:
      uri: ${INTEGRATION_MONGODB_URI:mongodb://localhost:27017/integration_db}
      auto-index-creation: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.project.integration: DEBUG
    org.springframework.web: DEBUG

integration:
  security:
    # Local pode ficar vazio para facilitar testes manuais.
    # Defina INTEGRATION_API_KEY se quiser testar o mesmo comportamento de homolog/prod.
    apiKey: ${INTEGRATION_API_KEY:}
    headerName: ${INTEGRATION_API_KEY_HEADER:X-Integration-Api-Key}
