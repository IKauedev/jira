server.port=8081
spring.application.name=integration-service
spring.data.mongodb.uri=mongodb://localhost:27017/integration_db

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Integration Properties
integration.github.baseUrl=https://api.github.com
integration.github.apiVersion=v3

integration.slack.baseUrl=https://slack.com/api
integration.slack.token=xoxb-your-token-here
integration.slack.webhookUrl=https://hooks.slack.com/services/YOUR/WEBHOOK/URL

logging.level.root=INFO
logging.level.com.project.integration=DEBUG
