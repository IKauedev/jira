spring:
  application:
    name: jira
  
  # Active Profile (dev, homolog, prod)
  profiles:
    active: dev

  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/jira_db
      auto-index-creation: true
  
  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  
  # DevTools Configuration
  devtools:
    restart:
      enabled: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    show-extensions: true

# JWT Configuration
jwt:
  secret: dev-secret-key-only-for-development-not-secure-at-all-change-in-production-immediately
  expiration: 86400000

# Logging Configuration
logging:
  level:
    root: INFO
    com.project.jira: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application Settings
app:
  version: 1.0.0
  title: Jira Backend Application
  description: API Backend Jira com gerenciamento de projetos, issues e integrações
  environment: default
