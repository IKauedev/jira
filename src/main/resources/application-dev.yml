spring:
  application:
    name: jira

  data:
    mongodb:
      uri: mongodb://localhost:27017/jira_db
      auto-index-creation: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  devtools:
    restart:
      enabled: true

  graphql:
    graphiql:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    show-extensions: true

jwt:
  secret: dev-secret-key-only-for-development-not-secure-at-all-change-in-production-immediately
  expiration: 86400000

logging:
  level:
    root: INFO
    com.project.jira: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  version: 1.0.0
  title: Jira Backend Application
  description: API Backend Jira com gerenciamento de projetos, issues e integrações
  environment: development
