spring:
  application:
    name: jira

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb-prod:27017/jira_db_prod}
      auto-index-creation: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  devtools:
    restart:
      enabled: false

  mail:
    host: ${SES_SMTP_HOST:${MAIL_HOST:email-smtp.us-east-1.amazonaws.com}}
    port: ${SES_SMTP_PORT:${MAIL_PORT:587}}
    username: ${SES_SMTP_USERNAME:${MAIL_USERNAME}}
    password: ${SES_SMTP_PASSWORD:${MAIL_PASSWORD}}
    properties:
      mail:
        smtp:
          auth: ${SES_SMTP_AUTH:${MAIL_SMTP_AUTH:true}}
          starttls:
            enable: ${SES_SMTP_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS_ENABLE:true}}

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_UI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mongo:
      enabled: true

jwt:
  secret: ${JWT_SECRET:change-me-in-production-env-variable-required}
  expiration: 3600000

logging:
  level:
    root: WARN
    com.project.jira: WARN
    org.springframework.web: WARN
    org.springframework.security: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  version: 1.0.0
  title: Jira Backend Application
  description: API Backend Jira com gerenciamento de projetos, issues e integrações
  environment: production
  email:
    enabled: ${EMAIL_ENABLED:true}
    provider: amazon-ses-smtp
    from: ${SES_FROM_EMAIL:${MAIL_FROM}}
  password-reset:
    expiration-hours: ${PASSWORD_RESET_EXPIRATION_HOURS:24}
    base-url: ${PASSWORD_RESET_BASE_URL}
    include-token-in-response: false
