spring:
  application:
    name: jira

  data:
    mongodb:
      uri: mongodb://mongodb-homolog:27017/jira_db_homolog
      auto-index-creation: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  devtools:
    restart:
      enabled: false

  mail:
    host: ${SES_SMTP_HOST:${MAIL_HOST:email-smtp.us-east-1.amazonaws.com}}
    port: ${SES_SMTP_PORT:${MAIL_PORT:587}}
    username: ${SES_SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${SES_SMTP_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SES_SMTP_AUTH:${MAIL_SMTP_AUTH:true}}
          starttls:
            enable: ${SES_SMTP_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS_ENABLE:true}}

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    show-extensions: true

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mongo:
      enabled: true

jwt:
  secret: ${JWT_SECRET_HOMOLOG:homolog-secret-key-for-testing-environment-should-be-strong-and-unique-per-environment}
  expiration: ${JWT_EXPIRATION:604800000}

logging:
  level:
    root: WARN
    com.project.jira: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  version: 1.0.0
  title: Jira Backend Application
  description: API Backend Jira com gerenciamento de projetos, issues e integrações
  environment: homologation
  email:
    enabled: ${EMAIL_ENABLED:true}
    provider: amazon-ses-smtp
    from: ${SES_FROM_EMAIL:${MAIL_FROM:noreply@example.com}}
  password-reset:
    expiration-hours: ${PASSWORD_RESET_EXPIRATION_HOURS:24}
    base-url: ${PASSWORD_RESET_BASE_URL:https://app.example.com/reset-password}
    include-token-in-response: ${PASSWORD_RESET_INCLUDE_TOKEN_IN_RESPONSE:false}
